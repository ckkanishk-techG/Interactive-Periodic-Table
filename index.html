document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x:1;min-width:340px;border:1px solid #e6e1d8;border-radius:10px;background:#fff;overflow:hidden;align-self:stretch\">\n      <div style=\"padding:16px 18px;background:{{ selTint }};border-bottom:1px solid #eeeae2\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <div>\n            <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#8c877a\">{{ sel.catName }}<\u002Fdiv>\n            <div style=\"font:600 26px/1.1 'Space Grotesk',sans-serif;color:#1d1c19;margin-top:8px\">{{ sel.name }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right\">\n            <div style=\"font:600 35px/1 'Space Grotesk',sans-serif;color:#1d1c19\">{{ sel.symbol }}<\u002Fdiv>\n            <div style=\"font:500 11px/1 'IBM Plex Mono',monospace;color:#8c877a;margin-top:5px\">Z = {{ sel.z }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:230px;background:#f4f2ee;border-bottom:1px solid #eeeae2\">\n        <model-viewer src=\"{{ modelSrc }}\" alt=\"{{ sel.name }} atomic model\" camera-controls=\"\" auto-rotate=\"\" auto-rotate-delay=\"0\" rotation-per-second=\"150deg\" shadow-intensity=\"1\" touch-action=\"pan-y\" style=\"width:100%;height:100%;background:transparent\"><\u002Fmodel-viewer>\n        <div style=\"position:absolute;left:12px;bottom:10px;font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#a8a294;pointer-events:none\">3D model · drag to rotate<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr\">\n        <sc-for list=\"{{ selRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #f2efe9;border-right:1px solid #f2efe9\">\n            <div style=\"font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#a8a294\">{{ r.k }}<\u002Fdiv>\n            <div style=\"font:500 13.5px/1.2 'Space Grotesk',sans-serif;color:#1d1c19;margin-top:5px\">{{ r.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px\">\n        <div style=\"font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#a8a294\">Electron configuration<\u002Fdiv>\n        <div style=\"font:500 14px/1.3 'IBM Plex Mono',monospace;color:#1d1c19;margin-top:6px\">{{ sel.config }}<\u002Fdiv>\n        <p style=\"margin:14px 0 0;font:400 12px/1.55 'Space Grotesk',sans-serif;color:#6d6759;text-wrap:pretty\">{{ selBlurb }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1b\" style=\"{{ showB }}\">\n<div class=\"dv-card\" style=\"width:1075px;padding:22px 24px 24px;background:#16181c;border-color:#262a30\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px\">\n    <div>\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#6d7682\">Trends<\u002Fdiv>\n      <h2 style=\"margin:7px 0 0;font:600 21px/1 'Space Grotesk',sans-serif;color:#f0f1f2\">{{ scaleLabel }}<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;background:#1e2127;border:1px solid #2c3037;border-radius:8px;padding:4px\">\n      <sc-for list=\"{{ scaleTabs }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(18,54px);grid-auto-rows:54px;gap:3px\">\n    <sc-for list=\"{{ cellsB }}\" as=\"c\" hint-placeholder-count=\"118\">\n      <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">\n        <div style=\"font:600 17px/1 'Space Grotesk',sans-serif\">{{ c.symbol }}<\u002Fdiv>\n        <div style=\"font:500 9.5px/1 'IBM Plex Mono',monospace;opacity:.8;margin-top:4px\">{{ c.val }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"grid-column:3;grid-row:6;border:1px dashed #343a42;border-radius:5px\"><\u002Fdiv>\n    <div style=\"grid-column:3;grid-row:7;border:1px dashed #343a42;border-radius:5px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:20px;margin-top:20px\">\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"height:10px;border-radius:5px;background:{{ rampCss }}\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;margin-top:7px;font:500 10px/1 'IBM Plex Mono',monospace;color:#8b94a0\">\n        <span>{{ scaleMin }}<\u002Fspan>\n        <span>{{ scaleUnit }}<\u002Fspan>\n        <span>{{ scaleMax }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #2c3037;border-radius:7px;background:#1e2127\">\n      <span style=\"width:11px;height:11px;border-radius:3px;border:1px dashed #4a525c;display:inline-block\"><\u002Fspan>\n      <span style=\"font:400 11px/1 'Space Grotesk',sans-serif;color:#8b94a0\">No measured value<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:18px;border-top:1px solid #262a30;padding-top:16px\">\n    <div style=\"font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6d7682;margin-bottom:10px\">Highest five<\u002Fdiv>\n    <div style=\"display:flex;gap:10px\">\n      <sc-for list=\"{{ topFive }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"flex:1;padding:12px 14px;border-radius:8px;background:{{ t.bg }}\">\n          <div style=\"font:600 17px/1 'Space Grotesk',sans-serif;color:#0e1013\">{{ t.symbol }} <span style=\"font:400 12px/1 'Space Grotesk',sans-serif;opacity:.7\">{{ t.name }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#0e1013;opacity:.8;margin-top:7px\">{{ t.val }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1c\" style=\"{{ showC }}\">\n<div class=\"dv-card\" style=\"width:1265px;padding:20px 22px 22px;background:#fdf8ee\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px\">\n    <h2 style=\"margin:0;font:700 21px/1 'Space Grotesk',sans-serif;color:#2a2318\">Pick two. See what changes.<\u002Fh2>\n    <div style=\"font:400 12px/1.4 'Space Grotesk',sans-serif;color:#8a7f6a;max-width:330px;text-align:right\">Tap elements to load them into the tray. Columns are groups, rows are periods, bands are orbital blocks.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:26px;align-items:flex-start\">\n    <div style=\"flex:none\">\n      <div style=\"display:grid;grid-template-columns:repeat(18,41px);gap:3px;margin-bottom:6px\">\n        <div style=\"grid-column:1 / span 2;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#a89878;padding-bottom:4px;border-bottom:2px solid #e6d9bf\">s-block<\u002Fdiv>\n        <div style=\"grid-column:3 / span 10;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#a89878;padding-bottom:4px;border-bottom:2px solid #e6d9bf\">d-block<\u002Fdiv>\n        <div style=\"grid-column:13 / span 6;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#a89878;padding-bottom:4px;border-bottom:2px solid #e6d9bf\">p-block<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(18,41px);grid-auto-rows:41px;gap:3px\">\n        <sc-for list=\"{{ cellsC }}\" as=\"c\" hint-placeholder-count=\"118\">\n          <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">\n            <div style=\"font:500 9.5px/1 'IBM Plex Mono',monospace;opacity:.75;align-self:flex-start;margin:5px 0 0 5px;font-size:8.5px\">{{ c.z }}<\u002Fdiv>\n            <div style=\"font:700 15px/1 'Space Grotesk',sans-serif;margin-top:-2px\">{{ c.symbol }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"grid-column:3;grid-row:6;border-radius:7px;background:#f2e7d2;display:flex;align-items:center;justify-content:center;font:600 9px/1.2 'IBM Plex Mono',monospace;color:#a89878\">57–71<\u002Fdiv>\n        <div style=\"grid-column:3;grid-row:7;border-radius:7px;background:#f2e7d2;display:flex;align-items:center;justify-content:center;font:600 9px/1.2 'IBM Plex Mono',monospace;color:#a89878\">89–103<\u002Fdiv>\n        <div style=\"grid-column:1 / span 18;grid-row:8;height:12px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:385px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#a89878\">Compare tray<\u002Fdiv>\n      <div style=\"display:flex;gap:12px\">\n        <sc-for list=\"{{ compareCards }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"{{ p.style }}\">\n            <div style=\"font:700 30px/1 'Space Grotesk',sans-serif;color:#2a2318\">{{ p.symbol }}<\u002Fdiv>\n            <div style=\"font:500 12px/1.2 'Space Grotesk',sans-serif;color:#6b6252;margin-top:6px\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;color:#a89878;margin-top:8px\">{{ p.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #ece0c8;border-radius:10px;background:#fff;overflow:hidden\">\n        <sc-for list=\"{{ compareRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f6efe1\">\n            <div style=\"font:600 13px/1.2 'Space Grotesk',sans-serif;color:#2a2318;text-align:right\">{{ r.a }}<\u002Fdiv>\n            <div style=\"font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#a89878;min-width:112px;text-align:center\">{{ r.k }}<\u002Fdiv>\n            <div style=\"font:600 13px/1.2 'Space Grotesk',sans-serif;color:#2a2318\">{{ r.b }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ clearCompare }}\" style=\"align-self:flex-start;border:1px solid #e6d9bf;background:#fff;border-radius:7px;padding:9px 14px;font:500 12px/1 'Space Grotesk',sans-serif;color:#8a7f6a;cursor:pointer\" style-hover=\"background:#faf3e6\">Clear tray<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1200}}\">\nclass Component extends DCLogic {\n  state = { data: null, q: \"\", cat: null, sel: 26, scale: \"en\", cmp: [6, 79], tab: \"1a\" };\n\n  componentDidMount() {\n    const w = () => window.__PT_DATA ? this.setState({ data: window.__PT_DATA }) : setTimeout(w, 30); w();\n  }\n\n  matches(e) {\n    const q = this.state.q.trim().toLowerCase();\n    if (this.state.cat && e.cat !== this.state.cat) return false;\n    if (!q) return true;\n    return e.name.toLowerCase().includes(q) || e.symbol.toLowerCase().startsWith(q) || String(e.z) === q;\n  }\n\n  ramp(t) {\n    const stops = [[38,54,102],[43,110,158],[54,159,148],[150,190,92],[243,222,110]];\n    const x = Math.max(0, Math.min(1, t)) * (stops.length - 1);\n    const i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;\n    const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));\n    return `rgb(${c[0]},${c[1]},${c[2]})`;\n  }\n\n  fmtRow(e, key) {\n    const s = (this.state.data.SCALES).find(x => x.key === key);\n    const v = e[key];\n    return v == null ? \"—\" : s.fmt(v);\n  }\n\n  renderVals() {\n    const d = this.state.data;\n    if (!d) return {};\n    const { ELEMENTS, CATEGORIES, CAT, SCALES } = d;\n    const active = this.state.q.trim() !== \"\" || this.state.cat !== null;\n    const sel = ELEMENTS.find(e => e.z === this.state.sel);\n    const scale = SCALES.find(s => s.key === this.state.scale);\n    const vals = ELEMENTS.map(e => e[scale.key]).filter(v => v != null);\n    const lo = Math.min(...vals), hi = Math.max(...vals);\n    const norm = v => (v == null ? null : (v - lo) / (hi - lo || 1));\n    const setSel = z => () => this.setState({ sel: z });\n\n    const cellsA = ELEMENTS.map(e => {\n      const on = this.matches(e), isSel = e.z === this.state.sel;\n      return {\n        z: e.z, symbol: e.symbol, name: e.name, color: e.color, onClick: setSel(e.z),\n        style: {\n          gridColumn: e.col, gridRow: e.row, position: \"relative\", display: \"flex\",\n          flexDirection: \"column\", alignItems: \"center\", justifyContent: \"flex-start\",\n          background: \"#fff\", border: isSel ? \"2px solid #1d1c19\" : \"1px solid #e4dfd5\",\n          borderRadius: 6, cursor: \"pointer\", overflow: \"hidden\",\n          opacity: active && !on ? 0.2 : 1,\n          boxShadow: isSel ? \"0 6px 18px rgba(0,0,0,.14)\" : \"none\",\n          transition: \"opacity .15s ease, box-shadow .15s ease\"\n        }\n      };\n    });\n\n    const cellsB = ELEMENTS.map(e => {\n      const t = norm(e[scale.key]);\n      return {\n        symbol: e.symbol, onClick: setSel(e.z),\n        val: e[scale.key] == null ? \"—\" : scale.fmt(e[scale.key]).replace(/\\s?(pm|K|g\\/cm³|CE)$/, \"\"),\n        style: {\n          gridColumn: e.col, gridRow: e.row, display: \"flex\", flexDirection: \"column\",\n          alignItems: \"center\", justifyContent: \"center\", borderRadius: 5, cursor: \"pointer\",\n          background: t == null ? \"transparent\" : this.ramp(t),\n          border: t == null ? \"1px dashed #343a42\" : \"1px solid rgba(0,0,0,.18)\",\n          color: t == null ? \"#5a626c\" : (t > 0.58 ? \"#15170f\" : \"#f2f4f6\")\n        }\n      };\n    });\n\n    const cellsC = ELEMENTS.map(e => {\n      const inTray = this.state.cmp.includes(e.z);\n      return {\n        z: e.z, symbol: e.symbol, onClick: () => this.setState(s => ({ cmp: s.cmp.includes(e.z) ? s.cmp.filter(z => z !== e.z) : [...s.cmp.slice(-1), e.z] })),\n        style: {\n          gridColumn: e.col, gridRow: e.row, display: \"flex\", flexDirection: \"column\",\n          alignItems: \"center\", justifyContent: \"center\", borderRadius: 7, cursor: \"pointer\",\n          background: e.color, color: \"#fff\",\n          outline: inTray ? \"3px solid #2a2318\" : \"none\", outlineOffset: 1,\n          transform: inTray ? \"scale(1.04)\" : \"none\", transition: \"transform .12s ease\"\n        }\n      };\n    });\n\n    const list = ELEMENTS.filter(e => this.matches(e));\n\n    const optTabBase = { display: \"flex\", alignItems: \"center\", gap: 8, border: \"none\", borderRadius: 6, padding: \"8px 14px\", cursor: \"pointer\", font: \"500 12.5px/1 'Space Grotesk',sans-serif\" };\n    const optTabs = [[\"1a\", \"Lab sheet\"], [\"1b\", \"Trends\"], [\"1c\", \"Classroom\"]].map(([id, label]) => ({\n      id, label, onClick: () => this.setState({ tab: id }),\n      style: this.state.tab === id\n        ? { ...optTabBase, background: \"#1d1c19\", color: \"#faf9f7\", boxShadow: \"0 1px 2px rgba(0,0,0,.2)\" }\n        : { ...optTabBase, background: \"transparent\", color: \"#6d6759\" }\n    }));\n    const vis = id => (this.state.tab === id ? {} : { display: \"none\" });\n\n    const chipBase = { display: \"flex\", alignItems: \"center\", gap: 7, padding: \"6px 11px\", borderRadius: 20, cursor: \"pointer\", font: \"500 11.5px/1 'Space Grotesk',sans-serif\" };\n    const catChips = CATEGORIES.map(c => ({\n      name: c.name, color: c.color, count: ELEMENTS.filter(e => e.cat === c.code).length,\n      onClick: () => this.setState(s => ({ cat: s.cat === c.code ? null : c.code })),\n      style: this.state.cat === c.code\n        ? { ...chipBase, border: \"1px solid #1d1c19\", background: \"#1d1c19\", color: \"#faf9f7\" }\n        : { ...chipBase, border: \"1px solid #e4dfd5\", background: \"#fff\", color: \"#6d6759\" }\n    }));\n\n    const tabBase = { border: \"none\", borderRadius: 6, padding: \"7px 12px\", cursor: \"pointer\", font: \"500 11.5px/1 'Space Grotesk',sans-serif\" };\n    const scaleTabs = SCALES.map(s => ({\n      label: s.label, onClick: () => this.setState({ scale: s.key }),\n      style: s.key === this.state.scale\n        ? { ...tabBase, background: \"#f0f1f2\", color: \"#16181c\" }\n        : { ...tabBase, background: \"transparent\", color: \"#8b94a0\" }\n    }));\n\n    const topFive = [...ELEMENTS].filter(e => e[scale.key] != null)\n      .sort((a, b) => b[scale.key] - a[scale.key]).slice(0, 5)\n      .map(e => ({ symbol: e.symbol, name: e.name, val: scale.fmt(e[scale.key]), bg: this.ramp(norm(e[scale.key])) }));\n\n    const cmpEls = this.state.cmp.map(z => ELEMENTS.find(e => e.z === z));\n    const cardBase = { flex: 1, padding: \"16px 18px\", borderRadius: 10, border: \"1px solid #ece0c8\", background: \"#fff\", minHeight: 108 };\n    const compareCards = [0, 1].map(i => {\n      const e = cmpEls[i];\n      return e\n        ? { symbol: e.symbol, name: e.name, hint: e.catName, style: { ...cardBase, borderLeft: `5px solid ${e.color}` } }\n        : { symbol: \"+\", name: \"Tap an element\", hint: \"Slot empty\", style: { ...cardBase, border: \"1px dashed #ddd0b4\", background: \"#fbf6ec\" } };\n    });\n    const rowKeys = [[\"mass\", \"Atomic mass\"], [\"en\", \"Electronegativity\"], [\"radius\", \"Atomic radius\"], [\"melt\", \"Melting point\"], [\"boil\", \"Boiling point\"], [\"density\", \"Density\"], [\"config\", \"Configuration\"]];\n    const show = (e, k) => {\n      if (!e) return \"—\";\n      if (k === \"mass\") return e.mass + \" u\";\n      if (k === \"config\") return e.config;\n      return this.fmtRow(e, k);\n    };\n    const compareRows = rowKeys.map(([k, label]) => ({ k: label, a: show(cmpEls[0], k), b: show(cmpEls[1], k) }));\n\n    const selRows = [\n      { k: \"Atomic mass\", v: sel.mass + \" u\" },\n      { k: \"Group · period\", v: (sel.group ? sel.group : \"f-block\") + \" · \" + sel.period },\n      { k: \"Electronegativity\", v: sel.en == null ? \"—\" : sel.en.toFixed(2) },\n      { k: \"Atomic radius\", v: sel.radius == null ? \"—\" : sel.radius + \" pm\" },\n      { k: \"Melting point\", v: sel.melt == null ? \"—\" : Math.round(sel.melt) + \" K\" },\n      { k: \"Boiling point\", v: sel.boil == null ? \"—\" : Math.round(sel.boil) + \" K\" },\n      { k: \"Density\", v: sel.density == null ? \"—\" : sel.density + \" g/cm³\" },\n      { k: \"State at 25 °C\", v: sel.state },\n      { k: \"Discovered\", v: sel.year < 0 ? \"c. \" + Math.abs(sel.year) + \" BCE\" : sel.year },\n      { k: \"Block\", v: (sel.cat === \"ln\" || sel.cat === \"an\") ? \"f\" : (sel.col <= 2 ? \"s\" : sel.col >= 13 ? \"p\" : \"d\") }\n    ];\n\n    return {\n      q: this.state.q,\n      onSearch: ev => this.setState({ q: ev.target.value }),\n      clearAll: () => this.setState({ q: \"\", cat: null }),\n      clearCompare: () => this.setState({ cmp: [] }),\n      catChips, cellsA, cellsB, cellsC, scaleTabs, topFive, optTabs,\n      showA: vis(\"1a\"), showB: vis(\"1b\"), showC: vis(\"1c\"),\n      compareCards, compareRows, selRows, sel,\n      modelSrc: `https://raw.githubusercontent.com/ckkanishk-techG/Interactive-Periodic-Table/main/models/${sel.z}.glb`,\n      selTint: sel.color + \"1f\",\n      selBlurb: CAT[sel.cat].blurb,\n      scaleLabel: scale.label,\n      scaleUnit: scale.unit,\n      scaleMin: scale.fmt(lo),\n      scaleMax: scale.fmt(hi),\n      rampCss: `linear-gradient(90deg, ${[0, .25, .5, .75, 1].map(t => this.ramp(t)).join(\",\")})`\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
