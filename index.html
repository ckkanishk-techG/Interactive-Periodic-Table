    <title>Periodic Table</title>

    <h1>Interactive Periodic Table</h1>

    <div class="table-scroll">
        <div class="table-container" id="periodicTable"></div>
    </div>

    <div class="legend" id="legend"></div>

    <div id="overlay"></div>

    <div id="modal">
        <button id="close-modal">Close</button>
        <h2 id="elementName"></h2>
        <div class="viewer-box" id="glbViewer">
            <model-viewer
                id="atomicViewer"
                camera-controls
                auto-rotate
                auto-rotate-delay="0"
                rotation-per-second="70deg"
                camera-orbit="0deg 75deg 130%"
                shadow-intensity="1"
                touch-action="pan-y"
            ></model-viewer>
        </div>

        <p><strong>Atomic Number:</strong> <span id="elementNumber"></span></p>
        <p><strong>Symbol:</strong> <span id="elementSymbol"></span></p>
        <p><strong>Atomic Mass:</strong> <span id="elementMass"></span></p>
        <p><strong>Category:</strong> <span id="elementCategory"></span></p>
    </div>

        <button id="close-modal2">Close</button>

            { name: "Alkali Metal", description: "Alkali metals are highly reactive elements found in Group 1 of the periodic table. They include lithium, sodium, potassium, rubidium, cesium, and francium. These metals are characterized by their soft texture, low melting points, and strong reactivity with water, producing hydrogen gas and forming alkaline hydroxides." },
            { name: "Alkaline Earth Metal", description: "Alkaline earth metals are elements found in Group 2 of the periodic table. They include beryllium, magnesium, calcium, strontium, barium, and radium. These metals are shiny, silvery-white, and relatively reactive, especially with water. They form basic oxides and are commonly used in construction, electronics, and manufacturing." },

            { name: "Post-transition Metal", description: "Post-transition metals are elements located to the right of the transition metals in the periodic table, typically in groups 13-16. They include elements like aluminum, gallium, tin, lead, and bismuth. These metals are characterized by lower melting points, lower densities, and higher electrical conductivity compared to transition metals." },
            { name: "Halogen", description: "Halogens are a group of five chemical elements in Group 17 of the periodic table: fluorine, chlorine, bromine, iodine, and astatine. They are highly reactive, particularly with alkali and alkaline earth metals, forming salts. Halogens are used in disinfectants, lighting, pharmaceuticals, and as reactants in industrial processes." },
            { name: "Lanthanide", description: "Lanthanides are a group of 15 elements in the periodic table, from atomic numbers 57 to 71, spanning from lanthanum to lutetium. They are known for their similar properties, including high melting points, magnetic susceptibility, and rare-earth characteristics, and are used in electronics, magnets, and catalytic processes." },

        // --- Render the periodic table ---
        const periodicTableElement = document.getElementById('periodicTable');

        elements.forEach(element => {
            const elementDiv = document.createElement('div');
            elementDiv.className = 'element';
            elementDiv.dataset.category = element.category;
            elementDiv.tabIndex = 0;
            elementDiv.setAttribute('role', 'button');
            elementDiv.setAttribute('aria-label', `${element.name} (${element.symbol})`);
            elementDiv.style.gridColumn = element.col;
            elementDiv.style.gridRow = element.row;
            elementDiv.innerHTML = `
                <div class="symbol">${element.symbol}</div>
                <div class="number">${element.number}</div>
                <div class="name">${element.name}</div>
            `;

            const openElementModal = () => {
                document.getElementById('elementName').textContent = element.name;
                document.getElementById('elementNumber').textContent = element.number;
                document.getElementById('elementSymbol').textContent = element.symbol;
                document.getElementById('elementMass').textContent = element.mass;
                document.getElementById('elementCategory').textContent = element.category;

                const modelViewer = document.getElementById('atomicViewer');
                modelViewer.src = `./models/${element.number}.glb`;
                modelViewer.setAttribute('auto-rotate', '');
                modelViewer.setAttribute('rotation-per-second', '150deg');

                showModal('modal');
            };

            elementDiv.addEventListener('click', openElementModal);
            elementDiv.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openElementModal();
                }
            });

            periodicTableElement.appendChild(elementDiv);
        });

        // --- Render the category legend ---
        const legendElement = document.getElementById('legend');

        CATEGORIES.forEach(category => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'legend-chip';
            chip.dataset.category = category.name;
            chip.textContent = category.name;

            chip.addEventListener('mouseenter', () => setHighlight(category.name, true));
            chip.addEventListener('mouseleave', () => setHighlight(category.name, false));
            chip.addEventListener('focus', () => setHighlight(category.name, true));
            chip.addEventListener('blur', () => setHighlight(category.name, false));
            chip.addEventListener('click', () => {
                document.getElementById('elementName2').textContent = category.name;
                document.getElementById('elementNumber2').textContent = category.description;
                showModal('modal2');
            });

            legendElement.appendChild(chip);
        });

        function setHighlight(categoryName, on) {
            document.querySelectorAll(`#periodicTable [data-category="${categoryName}"]`).forEach(el => {
                el.classList.toggle('highlight-noble-gas', on);
            });
        }

        // --- Modal helpers ---
        function showModal(id) {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
        }

        function closeModals() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal2').style.display = 'none';
        }

        document.getElementById('close-modal').addEventListener('click', closeModals);
        document.getElementById('close-modal2').addEventListener('click', closeModals);
        document.getElementById('overlay').addEventListener('click', closeModals);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModals();
        });

        // --- 3D model viewer wiring ---
        // auto-rotate-delay="0" on the element itself makes model-viewer resume
        // spinning immediately after the user lets go; forcing autoRotate back on
        // during the drag (mousedown/camera-change) used to fight that built-in
        // interaction handling and left it stuck after release.
        const atomicViewer = document.getElementById('atomicViewer');

        atomicViewer.addEventListener('load', () => {
            console.log('Model loaded:', atomicViewer.src);
        });
        atomicViewer.addEventListener('error', (err) => {
            console.error('Model failed to load:', atomicViewer.src, err);
        });
    </script>
