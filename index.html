<script>
  window.__G9_CANVAS_ID = 'atomCanvas';

  (function() {
    const originalCreateElement = Document.prototype.createElement;

    Document.prototype.createElement = function(tagName, options) {
      if (String(tagName).toLowerCase() === 'canvas') {
        const userCanvas = document.getElementById(window.__G9_CANVAS_ID);
        if (userCanvas) {
          userCanvas.style.display = userCanvas.style.display || 'block';

          if (!userCanvas.getAttribute('width')) {
            const rect = userCanvas.getBoundingClientRect();
            const w = Math.round(rect.width) || 500;
            const h = Math.round(rect.height) || 500;
            userCanvas.setAttribute('width', w);
            userCanvas.setAttribute('height', h);
          }

          return userCanvas;
        }
      }
      return originalCreateElement.call(this, tagName, options);
    };

    window.__restoreCreateElement = function() {
      Document.prototype.createElement = originalCreateElement;
    };
  })();
</script>

    <div class="table-container">

        <div class="category pos2 element" id="pos2" style="grid-column: 2 / 3;">Noble Gas</div> 
        <div class="category pos3 element" id="pos3" style="grid-column: 2 / 3;">Alkaline Earth Metal</div>

                shadow-intensity="1"
                touch-action="pan-y"

            <script>
            const mv = document.getElementById("atomicViewer");

            // Log when model loads successfully
            mv.addEventListener("load", () => {
                console.log("✅ Model loaded successfully:", mv.src);
            });

            // Log when model fails to load
            mv.addEventListener("error", (err) => {
                console.error("❌ Model failed to load:", mv.src, err);
            });

            // Force constant rotation
            function forceSpin() {
                mv.autoRotate = true;
                mv.setAttribute("auto-rotate", "");
                mv.setAttribute("rotation-per-second", "150deg");
            }

            // Reinforce rotation after user interaction
            mv.addEventListener("camera-change", forceSpin);
            mv.addEventListener("mousedown", forceSpin);
            mv.addEventListener("mouseup", forceSpin);
            mv.addEventListener("touchstart", forceSpin);
            mv.addEventListener("touchend", forceSpin);
            </script>
