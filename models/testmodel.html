<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Always Spinning GLB Viewer</title>

  <!-- Import model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background: #111; }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="./32.glb"
    alt="Element Model"
    
    camera-controls
    auto-rotate
    rotation-per-second="120deg"  <!-- MUCH faster -->

    shadow-intensity="1"
    touch-action="pan-y"
  ></model-viewer>

  <script>
    const viewer = document.getElementById("viewer");

    // Override default behavior → never stop rotation
    viewer.addEventListener("mousedown", () => viewer.autoRotate = true);
    viewer.addEventListener("mouseup", () => viewer.autoRotate = true);
    viewer.addEventListener("touchstart", () => viewer.autoRotate = true);
    viewer.addEventListener("touchend", () => viewer.autoRotate = true);
    viewer.addEventListener("camera-change", () => viewer.autoRotate = true);
  </script>

</body>
</html>
